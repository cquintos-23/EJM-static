<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJM — Initiatives & FAQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="preconnect" href="https://drive.google.com">
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
    :root {
        --color-off-black: #3D3D31;
        --color-white: #ffffff;
        --color-sand: #B8B8A0;
        --color-dark-sand: #5A5A48;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Geist Mono',monospace; background:#fff; color:#3D3D31; overflow:hidden; }

    /* ═══════════════════════════════════
       STATIC CONTENT (below scrollytelling)
    ═══════════════════════════════════ */
    #static-content {
        position:relative; z-index:5;
        background:#fff;
        padding:80px 5vw 60px;
    }

    /* expanding panels carousel */
    #initiative-carousel {
        display:flex; gap:6px; margin-bottom:80px;
        height:380px; overflow:hidden; border-radius:12px;
    }
    .init-panel {
        flex:1 1 0;           /* all panels share space equally when collapsed */
        min-width:0;
        border-radius:10px;
        overflow:hidden; cursor:pointer;
        transition:flex-grow 0.45s cubic-bezier(0.4,0,0.2,1);
        position:relative;
    }
    /* the image fills the whole panel as the background slice */
    .init-panel-bg {
        position:absolute; inset:0;
        background-size:cover; background-position:center;
        transition:filter 0.3s;
        filter:brightness(0.82);
    }
    .init-panel:hover .init-panel-bg { filter:brightness(1); }
    /* dark gradient at bottom for legibility when expanded */
    .init-panel-bg::after {
        content:''; position:absolute; inset:0;
        background:linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 55%);
        opacity:0; transition:opacity 0.3s;
    }
    .init-panel:hover .init-panel-bg::after { opacity:1; }
    /* hover expands this panel to ~3× its share */
    .init-panel:hover { flex-grow:4; }
    /* expanded card content (overlaid on image) */
    .init-panel-content {
        position:absolute; bottom:0; left:0; right:0;
        padding:16px 16px 18px;
        opacity:0; transition:opacity 0.2s 0.42s;
    }
    .init-panel:hover .init-panel-content { opacity:1; transition:opacity 0.2s 0.42s; }
    .init-panel:not(:hover) .init-panel-content { opacity:0; transition:opacity 0s; }
    .init-card-title { font-family:'Geist',sans-serif; font-size:0.88rem; font-weight:600; color:#fff; margin-bottom:5px; line-height:1.35; }
    .init-card-meta  { font-family:'Geist Mono',monospace; font-size:7pt; color:rgba(255,255,255,0.75); line-height:1.6; }
    .init-card-link  { display:inline-block; margin-top:8px; font-family:'Geist',sans-serif; font-size:7.5pt; font-weight:600; color:#8ECBF0; text-decoration:none; }
    .init-card-link:hover { text-decoration:underline; }


    </style>
</head>
<body>
<!-- ═══ STATIC CONTENT ═══ -->
<div id="static-content">

    <!-- Initiative carousel -->
    <div id="initiative-carousel">
        <!-- Cards injected by JS once data loads -->
    </div>


</div><!-- /static-content -->

<script>
Papa.parse('https://docs.google.com/spreadsheets/d/e/2PACX-1vSKgeCFRWhEydDOm3JMjw-F9MI8bNvgWYkXSA-_3S8Mo9Ehxs3WrB07UbNfrFdfDiOLqHc67BR6kyaG/pub?gid=600477657&single=true&output=csv',{
    download:true, header:true,
    complete(results){
        const data=results.data.filter(r=>r.Region && (r["Carmen's "]||'').trim().toLowerCase()==='aa');
        buildCarousel(results.data);
    },
    error(){ console.error('Data load failed'); }
});

/* ════════════════════════════════════════════════════
   CAROUSEL (static content, built once data loads)
════════════════════════════════════════════════════ */
function buildCarousel(allData){
    const container=document.getElementById('initiative-carousel');
    const ccRows=allData.filter(r=>r.Title && (r["Carmen's "]||'').trim().toLowerCase()==='cc');
    const sample=ccRows.filter(r=>r['Cover Image']);
    const extra=ccRows.filter(r=>!r['Cover Image']);
    while(extra.length) sample.push(extra.shift());
    container.innerHTML=sample.map((d,i)=>{
        const img=(d['Cover Image']||'').trim();
        const bgStyle=img?`background-image:url('${img}')`:`background:#C8C8B8`;
        // Preload first image eagerly via a hidden img tag for faster paint
        const preload=img&&i===0?`<img src="${img}" style="display:none" fetchpriority="high" alt="">`:'';
        return `
        <div class="init-panel">
            ${preload}
            <div class="init-panel-bg" style="${bgStyle}"></div>
            <div class="init-panel-content">
                <div class="init-card-title">${d.Title||'Unknown Initiative'}</div>
                <div class="init-card-meta">
                    ${d['Primary Year']||'—'} &nbsp;·&nbsp;
                    ${(d.Status||'—').trim()} &nbsp;·&nbsp;
                    ${d.Region||'—'}
                </div>
                ${d.Permalink?`<a class="init-card-link" href="${d.Permalink}" target="_blank">View initiative ↗</a>`:''}
            </div>
        </div>`;
    }).join('');
}


</script>
</body>
</html>
